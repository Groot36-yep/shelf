name: Build Windows app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Safety tests on real Windows
        run: |
          node tests/parser.test.js
          node tests/fileops.test.js

      - name: Rename scripts in Windows PowerShell
        run: node tests/scripts.test.js
        env:
          SKIP_BASH: '1'
          PWSH: powershell.exe

      - name: Build installer
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Shelf-Windows
          path: dist/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          body: |
            ## Shelf for Windows

            **Download `Shelf-Setup-....exe`** (installer), or the Portable version if you'd rather not install anything.

            Windows will warn that the app is from an unknown publisher, because it isn't code-signed yet: click **More info → Run anyway**.

            Private by design: your videos never leave your computer, only titles are looked up on TMDB and TVmaze, and your TMDB key is stored encrypted with your Windows account.
