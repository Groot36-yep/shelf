name: Build Windows app

on:
  # Runs when the version number in package.json changes, or when started by hand.
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Install
        run: npm ci

      - name: Safety tests on real Windows
        run: |
          node tests/parser.test.js
          node tests/fileops.test.js
          node tests/scan.test.js
          node tests/subs.test.js
          node tests/cards-real.test.js
          node tests/updates.test.js
          node tests/ssh-loopback.test.js

      - name: Build installer
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check the built app can read title cards
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $p = Start-Process -FilePath dist\win-unpacked\Shelf.exe -ArgumentList 'tests\packaged-scan.test.js' -Wait -PassThru -NoNewWindow -RedirectStandardOutput scan-out.txt -RedirectStandardError scan-err.txt
          Get-Content scan-out.txt, scan-err.txt | Write-Host
          if ($p.ExitCode -ne 0) { Write-Host "::error::The built app couldn't read a title card"; exit 1 }

      - name: Check the built app can send to a Plex server (SSH)
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $p = Start-Process -FilePath dist\win-unpacked\Shelf.exe -ArgumentList 'tests\ssh-loopback.test.js','packaged' -Wait -PassThru -NoNewWindow -RedirectStandardOutput ssh-out.txt -RedirectStandardError ssh-err.txt
          Get-Content ssh-out.txt, ssh-err.txt | Write-Host
          if ($p.ExitCode -ne 0) { Write-Host "::error::The built app couldn't send over SSH"; exit 1 }

      - name: Check that Shelf really opens (installed and portable)
        shell: pwsh
        run: |
          function Wait-ShelfWindow([int]$seconds) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            while ($sw.Elapsed.TotalSeconds -lt $seconds) {
              if (Get-Process | Where-Object { $_.MainWindowTitle -like '*Shelf*' }) { return [math]::Round($sw.Elapsed.TotalSeconds, 1) }
              Start-Sleep -Milliseconds 500
            }
            return $null
          }
          function Stop-Shelf { Get-Process | Where-Object { $_.ProcessName -match 'shelf' } | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep 3 }
          $bad = 0

          $setup = Get-ChildItem dist -Filter 'Shelf-Setup-*.exe' | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $installed = $null
          for ($i = 0; $i -lt 300 -and -not $installed; $i++) {
            $installed = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Shelf.exe' -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq 'Shelf.exe' } | Select-Object -First 1
            if (-not $installed) { Start-Sleep 1 }
          }
          Write-Host "Installed at: $($installed.FullName)"
          if (-not $installed) {
            Write-Host "::error::Setup did not install Shelf.exe"; $bad++
            Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 30 FullName | Out-String | Write-Host
          }
          else {
            Start-Process $installed.FullName
            $t = Wait-ShelfWindow 60
            if ($t -eq $null) { Write-Host "::error::Installed Shelf did not open a window"; $bad++ } else { Write-Host "::notice::Installed Shelf opened in $t s" }
            $log = Join-Path $env:APPDATA 'Shelf\startup.log'
            if (Test-Path $log) { Get-Content $log | Write-Host }
            Stop-Shelf
          }

          $portable = Get-ChildItem dist -Filter 'Shelf-Portable-*.exe' | Select-Object -First 1
          Start-Process $portable.FullName
          $t = Wait-ShelfWindow 120
          if ($t -eq $null) { Write-Host "::error::Portable Shelf did not open a window"; $bad++ } else { Write-Host "::notice::Portable Shelf opened in $t s" }
          Stop-Shelf
          exit $bad

      - uses: actions/upload-artifact@v4
        with:
          name: Shelf-Windows
          path: dist/*.exe

      - name: Release notes (the newest "Done" section of ROADMAP.md becomes "What's new")
        shell: pwsh
        run: |
          $lines = Get-Content ROADMAP.md -Encoding utf8
          $start = ($lines | Select-String -Pattern '^## Done' | Select-Object -First 1).LineNumber
          $news = @()
          if ($start) {
            for ($i = $start; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '^## ') { break }; $news += $lines[$i] }
          }
          $body = @("## What's new") + $news + @('', '## Shelf for Windows', '',
            "**Download ``Shelf-Setup-....exe``** (installer), or the Portable version if you'd rather not install anything. Already have Shelf? Click **Updates** in its sidebar.",
            '', "Windows will warn that the app is from an unknown publisher, because it isn't code-signed yet: click **More info → Run anyway**.",
            '', 'Private by design: your videos never leave your computer, only titles are looked up on TMDB and TVmaze, and your TMDB key is stored encrypted with your Windows account.')
          $body -join "`n" | Set-Content release-notes.md -Encoding utf8
          Get-Content release-notes.md | Write-Host

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VERSION }}
          name: Shelf ${{ steps.ver.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.exe
          body_path: release-notes.md
